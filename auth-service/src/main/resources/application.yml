server:
  port: 8087

spring:
  application:
    name: auth-service

camp:
  security:
    jwt-secret: ${CAMP_JWT_SECRET:camp-development-secret-key-32-chars}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
