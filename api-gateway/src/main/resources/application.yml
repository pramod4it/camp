server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: auth-service-openapi
              uri: lb://auth-service
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service,/v3/api-docs
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
            - id: user-service-openapi
              uri: lb://user-service
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service,/v3/api-docs
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            - id: order-service-openapi
              uri: lb://order-service
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - RewritePath=/v3/api-docs/order-service,/v3/api-docs
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
            - id: payment-service-openapi
              uri: lb://payment-service
              predicates:
                - Path=/v3/api-docs/payment-service
              filters:
                - RewritePath=/v3/api-docs/payment-service,/v3/api-docs
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
            - id: inventory-service-openapi
              uri: lb://inventory-service
              predicates:
                - Path=/v3/api-docs/inventory-service
              filters:
                - RewritePath=/v3/api-docs/inventory-service,/v3/api-docs
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
            - id: notification-service-openapi
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - RewritePath=/v3/api-docs/notification-service,/v3/api-docs
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/v1/search/**
            - id: search-service-openapi
              uri: lb://search-service
              predicates:
                - Path=/v3/api-docs/search-service
              filters:
                - RewritePath=/v3/api-docs/search-service,/v3/api-docs

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: api-gateway
    urls:
      - name: api-gateway
        url: /v3/api-docs
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: user-service
        url: /v3/api-docs/user-service
      - name: inventory-service
        url: /v3/api-docs/inventory-service
      - name: order-service
        url: /v3/api-docs/order-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: search-service
        url: /v3/api-docs/search-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

camp:
  security:
    jwt-secret: ${CAMP_JWT_SECRET:camp-development-secret-key-32-chars}
