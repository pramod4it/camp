apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: camp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: camp/user-service:deploy
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: camp-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://user-mysql:3306/userdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: camp-db-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camp-db-secret
                  key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: camp
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
---
