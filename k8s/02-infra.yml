apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-mysql
  namespace: camp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-mysql
  template:
    metadata:
      labels:
        app: user-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --innodb-use-native-aio=0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: camp-db-secret
          env:
            - name: MYSQL_DATABASE
              value: userdb
---
apiVersion: v1
kind: Service
metadata:
  name: user-mysql
  namespace: camp
spec:
  selector:
    app: user-mysql
  ports:
    - port: 3306
      targetPort: 3306
